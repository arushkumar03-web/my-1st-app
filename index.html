<html lang="en" data-theme="dark" style="color-scheme: dark;"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Coaching Centre App</title>
<style>
:root{--bg:#f5f6fb;--card:#fff;--tx:#1b1d2a;--mu:#6b7080;--pr:#4f46e5;--ok:#16a34a;--wa:#d97706;--bad:#dc2626;--bd:#e4e6f0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131a;--card:#1c1e2a;--tx:#eceef8;--mu:#9aa0b4;--pr:#8b85ff;--ok:#4ade80;--wa:#fbbf24;--bad:#f87171;--bd:#2a2d3d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12131a;--card:#1c1e2a;--tx:#eceef8;--mu:#9aa0b4;--pr:#8b85ff;--ok:#4ade80;--wa:#fbbf24;--bad:#f87171;--bd:#2a2d3d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:560px;margin:0 auto;padding:16px 16px 100px}
h1{font-size:18px;margin:0}h2{font-size:20px;margin:6px 0 12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.card,.row{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:0 0 12px}
.row{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px}
.rk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bd);font-size:14px}
.r0{background:#f5b301;color:#fff}.r1{background:#9ca3af;color:#fff}.r2{background:#c77c3b;color:#fff}
.nm{flex:1;font-weight:600}.sc{font-weight:700;font-size:20px;color:var(--pr)}small,.k{color:var(--mu);font-weight:400}
.k{font-size:12px;text-transform:uppercase;letter-spacing:.04em}
select,input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0 10px}
button,.btn{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--pr);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.g{background:var(--bd);color:var(--tx)}.d{background:var(--bad);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav a{flex:1;text-align:center;font-size:11px;color:var(--mu);padding:4px;text-decoration:none}
nav a i{display:block;font-style:normal;font-size:22px}nav a.on{color:var(--pr);font-weight:700}
.chip{padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600}
.ok{background:#dcfce7;color:#166534}.wa{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}
.bar{height:8px;border-radius:5px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.grid+.card{margin-top:12px}
.ln{display:flex;justify-content:space-between;margin-top:8px}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.seg{display:flex;gap:8px;margin-bottom:12px}.seg button{flex:1}.login{max-width:420px;margin:0 auto;padding:32px 16px}
.toast{position:fixed;left:16px;right:16px;bottom:90px;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:12px;z-index:10;text-align:center}
</style><style>artifact-sync,artifact-local{display:contents}</style><style>artifact-sync,artifact-local{display:contents}</style></head>

lass 10","subjects":{"Maths":65,"Science":72,"English":80,"Hindi":74,"Social":79},"tests":[{"n":"Unit Test 3","s":78},{"n":"Mid-term","s":70},{"n":"Unit Test 2","s":75},{"n":"Unit Test 1","s":72}],"fee":{"total":24000,"paid":12000,"due":"2026-11-09"},"remark":""},{"id":"tpz6r4e","name":"Meera Nair","cls":"Class 10","subjects":{"Maths":72,"Science":68,"English":82,"Hindi":70,"Social":66},"tests":[{"n":"Unit Test 3","s":75},{"n":"Mid-term","s":73},{"n":"Unit Test 2","s":68},{"n":"Unit Test 1","s":71}],"fee":{"total":24000,"paid":24000,"due":"2026-12-02"},"remark":""},{"id":"b239x8w","name":"Arjun Mehta","cls":"Class 10","subjects":{"Maths":58,"Science":70,"English":76,"Hindi":68,"Social":74},"tests":[{"n":"Unit Test 3","s":72},{"n":"Mid-term","s":65},{"n":"Unit Test 2","s":70},{"n":"Unit Test 1","s":62}],"fee":{"total":24000,"paid":8000,"due":"2026-10-13"},"remark":""},{"id":"wzx0x6h","name":"Sara Ali","cls":"Class 10","subjects":{"Maths":62,"Science":66,"English":74,"Hindi":60,"Social":71},"tests":[{"n":"Unit Test 3","s":69},{"n":"Mid-term","s":64},{"n":"Unit Test 2","s":66},{"n":"Unit Test 1","s":63}],"fee":{"total":24000,"paid":16000,"due":"2026-11-19"},"remark":""},{"id":"nq8tma4","name":"Yash Joshi","cls":"Class 10","subjects":{"Maths":48,"Science":60,"English":70,"Hindi":58,"Social":66},"tests":[{"n":"Unit Test 3","s":64},{"n":"Mid-term","s":58},{"n":"Unit Test 2","s":61},{"n":"Unit Test 1","s":55}],"fee":{"total":24000,"paid":24000,"due":"2026-11-24"},"remark":""},{"id":"97bceci","name":"Riya Desai","cls":"Class 9","subjects":{"Maths":88,"Science":92,"English":85,"Hindi":90,"Social":87},"tests":[{"n":"Unit Test 3","s":90},{"n":"Mid-term","s":88},{"n":"Unit Test 2","s":91},{"n":"Unit Test 1","s":84}],"fee":{"total":20000,"paid":20000,"due":"2026-11-22"},"remark":""},{"id":"cwwmlmw","name":"Nikhil Das","cls":"Class 9","subjects":{"Maths":80,"Science":76,"English":88,"Hindi":82,"Social":79},"tests":[{"n":"Unit Test 3","s":84},{"n":"Mid-term","s":80},{"n":"Unit Test 2","s":78},{"n":"Unit Test 1","s":81}],"fee":{"total":20000,"paid":10000,"due":"2026-11-04"},"remark":""},{"id":"knqntf4","name":"Tanvi Shah","cls":"Class 9","subjects":{"Maths":70,"Science":78,"English":72,"Hindi":80,"Social":69},"tests":[{"n":"Unit Test 3","s":77},{"n":"Mid-term","s":74},{"n":"Unit Test 2","s":70},{"n":"Unit Test 1","s":72}],"fee":{"total":20000,"paid":15000,"due":"2026-11-16"},"remark":""}]}</script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const td=()=>new Date().toISOString().slice(0,10);
const dd=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,9);
const fmt=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const pend=s=>Math.max(0,s.fee.total-s.fee.paid);
const days=s=>Math.round((new Date(td())-new Date(s.fee.due))/864e5);
function seed(){
 const SU=['Maths','Science','English','Hindi','Social'],TN=['Unit Test 3','Mid-term','Unit Test 2','Unit Test 1'];
 const R=[['Aarav Sharma',10,[92,88,85,80,90],[94,91,88,86],24,24,10],['Diya Patel',10,[95,90,78,82,88],[91,89,92,85],24,12,-12],['Rohan Verma',10,[84,79,90,86,81],[88,82,85,80],24,24,10],['Ananya Singh',10,[78,85,92,88,84],[86,90,83,79],24,18,5],['Kabir Khan',10,[88,72,70,75,80],[83,78,80,74],24,6,-20],['Ishita Rao',10,[70,80,88,85,76],[81,77,79,82],24,24,15],['Vihaan Gupta',10,[65,72,80,74,79],[78,70,75,72],24,12,-3],['Meera Nair',10,[72,68,82,70,66],[75,73,68,71],24,24,20],['Arjun Mehta',10,[58,70,76,68,74],[72,65,70,62],24,8,-30],['Sara Ali',10,[62,66,74,60,71],[69,64,66,63],24,16,7],['Yash Joshi',10,[48,60,70,58,66],[64,58,61,55],24,24,12],['Riya Desai',9,[88,92,85,90,87],[90,88,91,84],20,20,10],['Nikhil Das',9,[80,76,88,82,79],[84,80,78,81],20,10,-8],['Tanvi Shah',9,[70,78,72,80,69],[77,74,70,72],20,15,4],['Om Pandey',9,[55,62,70,64,60],[66,60,58,63],20,5,-15]];
 return{centre:'Your Coaching Centre',notes:[],students:R.map(r=>({id:uid(),name:r[0],cls:'Class '+r[1],subjects:Object.fromEntries(SU.map((k,i)=>[k,r[2][i]])),tests:TN.map((n,i)=>({n,s:r[3][i]})),fee:{total:r[4]*1e3,paid:r[5]*1e3,due:dd(r[6])},remark:''}))};
}
let S;try{S=JSON.parse($('app-data').textContent)}catch(e){}
if(!S||!S.students)S=seed();
const CL=Array.from({length:10},(_,i)=>'Class '+(i+1));
const classes=()=>[...new Set([...CL,...S.students.map(s=>s.cls)])];
const LS={get(){try{return JSON.parse(localStorage.getItem('cc_user'))}catch(e){return null}},set(v){try{v?localStorage.setItem('cc_user',JSON.stringify(v)):localStorage.removeItem('cc_user')}catch(e){}}};
let user=LS.get(),lrole='student';
if(user&&user.role==='teacher'&&(!S.pin||user.k!==S.pin.h))user=null;
let mine=(user&&user.cls)||'';
const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const TABS=['home','report','fees','notes'];
let tab=TABS.includes(location.hash.slice(1))?location.hash.slice(1):'home',cls='Class 10',sid=(S.students[0]||{}).id,modal='',msg='',teacher=false,preview=false,art=null,assets=null;
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const isT=()=>user&&user.role==='teacher',T=()=>isT()&&teacher;
const nores=()=>empty(isT()?'No students yet. Tap Add student on Home.':'Your marks are not added yet. Ask your teacher to add you with the same name and class.');
const pool=()=>isT()?S.students:S.students.filter(s=>s.cls===mine&&norm(s.name)===norm(user.name));
const cur=()=>pool().find(s=>s.id===sid)||pool()[0];
const ed=id=>T()?`data-edit="${id}"`:'';
const empty=t=>`<div class="card"><small>${t}</small></div>`;
const toast=m=>{msg=m;render();setTimeout(()=>{msg='';render()},2500)};
const selOpts=(arr,v)=>arr.map(a=>`<option value="${esc(a[0])}"${a[0]===v?' selected':''}>${esc(a[1])}</option>`).join('');
const clsSel=()=>`<select id="cs">${selOpts(classes().map(c=>[c,c]),cls)}</select>`;
const stuSel=()=>!isT()?'':`<select id="ss">${selOpts(pool().map(s=>[s.id,s.name+' · '+s.cls]),(cur()||{}).id)}</select>`;

function login(){
 const st=lrole==='student',f=(l,i,t='text')=>`<label class="k">${l}</label><input id="${i}" type="${t}" autocomplete="off">`;
 return `<div class="login"><h1 style="font-size:26px;text-align:center">🎓 ${esc(S.centre)}</h1><p class="k" style="text-align:center">Log in to continue</p><div class="seg"><button class="${st?'':'g'}" data-act="lr" data-r="student">🎒 Student</button><button class="${st?'g':''}" data-act="lr" data-r="teacher">👩‍🏫 Teacher</button></div><div class="card">${f(st?'Full name':'Teacher name','ln')}${st?`<label class="k">Class</label><select id="lc">${selOpts(CL.map(c=>[c,c]),'Class 1')}</select>`:''}${f(st?'School':'Subject you teach','ls')}${f('Phone number','lp','tel')}${st?'':f(S.pin?'Teacher PIN':'Create a teacher PIN (owner only)','pw','password')}<div id="le" style="color:var(--bad);min-height:22px"></div><button data-act="login" style="width:100%">Log in</button></div></div>`;
}
function home(){
 const c=isT()?cls:mine,L=S.students.filter(s=>s.cls===c&&s.tests.length).sort((a,b)=>b.tests[0].s-a.tests[0].s).slice(0,10);
 return (isT()?`<h2>🏆 Top 10 Leaderboard</h2>${clsSel()}`:`<h2>🏆 ${esc(c)} · Top 10</h2>`)+(L.length?L.map((s,i)=>`<div class="row" ${ed(s.id)}><b class="rk r${i}">${i+1}</b><span class="nm">${esc(s.name)}<br><small>${esc(s.tests[0].n)}</small></span><span class="sc">${s.tests[0].s}<small>/100</small></span></div>`).join(''):empty('No test scores yet for '+esc(c)+'.'))+(T()?`<button data-act="add">＋ Add student</button>`:'');
}
function report(){
 if(!cur())return nores();
 const s=cur(),E=Object.entries(s.subjects).sort((a,b)=>b[1]-a[1]),st=E[0],wk=E[E.length-1];
 const avg=E.length?Math.round(E.reduce((a,e)=>a+e[1],0)/E.length):0,need=E.filter(e=>e[1]<60&&e!==wk);
 const sub=e=>esc(e[0])+' · '+e[1]+'%',box=(t,c,v)=>`<div class="card"><div class="k">${t}</div><b style="color:var(--${c})">${v}</b></div>`;
 return `<h2>📊 Report Card</h2>${stuSel()}<div class="card"><b style="font-size:18px">${esc(s.name)}</b><br><small>${esc(s.cls)} · Average ${avg}%</small>${T()?`<br><br><button class="g" ${ed(s.id)}>✏️ Customise report card</button>`:''}</div>
 <div class="grid">${box('💪 Strong subject','ok',st?sub(st):'—')}${box('⚠️ Weak subject','bad',wk?sub(wk):'—')}</div>
 ${box('📈 Needs improvement','wa',need.length?need.map(sub).join('<br>'):'None 🎉')}
 <div class="card"><div class="k">⭐ Top 3 subjects</div>${E.slice(0,3).map(e=>`<div class="ln"><span>${esc(e[0])}</span><b>${e[1]}%</b></div><div class="bar"><i style="width:${Math.min(100,e[1])}%"></i></div>`).join('')||'—'}</div>
 <div class="card"><div class="k">📝 Top 3 test scores</div>${[...s.tests].sort((a,b)=>b.s-a.s).slice(0,3).map(t=>`<div class="ln"><span>${esc(t.n)}</span><b>${t.s}</b></div>`).join('')||'—'}</div>
 ${s.remark?`<div class="card"><div class="k">🗒️ Teacher’s remark</div>${esc(s.remark)}</div>`:''}`;
}
function fees(){
 if(!cur())return nores();
 const s=cur(),p=pend(s),d=days(s),f=s.fee,c=(k,v,x='')=>`<div><div class="k">${k}</div><b ${x}>${v}</b></div>`;
 const chip=x=>p===0?['ok','Paid ✅']:x>0?['bad','Delayed by '+x+' day'+(x>1?'s':'')]:['wa','Pending · due '+f.due];
 let h=`<h2>💰 Fees</h2>${stuSel()}<div class="card"><span class="chip ${chip(d)[0]}">${chip(d)[1]}</span><div class="grid" style="margin-top:12px">${c('Total',fmt(f.total))}${c('Paid',fmt(f.paid))}${c('Pending',fmt(p),'style="color:var(--bad)"')}${c('Due date',f.due||'—')}</div></div>`;
 if(T()){const P=S.students.filter(x=>pend(x)>0).sort((a,b)=>days(b)-days(a));
  h+=`<h2>All pending (${P.length}) · ${fmt(P.reduce((a,x)=>a+pend(x),0))}</h2>`+P.map(x=>{const k=days(x);return `<div class="row" ${ed(x.id)}><span class="nm">${esc(x.name)}<br><small>${esc(x.cls)}</small></span><span><b>${fmt(pend(x))}</b><br><span class="chip ${k>0?'bad':'wa'}">${k>0?k+'d late':'Pending'}</span></span></div>`}).join('');}
 return h;
}
function notes(){
 const N=isT()?S.notes:S.notes.filter(n=>n.cls==='All'||n.cls===mine);
 return `<h2>📚 Notes &amp; PDFs</h2>`+(T()?`<div class="card"><div class="k">Upload note / PDF</div><input id="nt" placeholder="Title (e.g. Algebra chapter 3)"><select id="nc"><option>All</option>${classes().map(c=>`<option>${esc(c)}</option>`).join('')}</select><input id="nf" type="file" accept=".pdf,image/*"><button data-act="up">Upload</button></div>`:'')+(N.length?N.map(n=>`<div class="row"><span style="font-size:26px">📄</span><span class="nm">${esc(n.title)}<br><small>${esc(n.cls)} · ${n.date}</small></span><a class="btn" href="/_blob/${n.aid}" target="_blank" rel="noopener">Open</a>${T()?`<button class="d" data-del="${n.id}">✕</button>`:''}</div>`).join(''):empty('No notes uploaded yet.'));
}
function sheet(id){
 const s=id?S.students.find(x=>x.id===id):{name:'',cls:cls||'Class 10',subjects:{Maths:0},tests:[],fee:{total:0,paid:0,due:dd(30)},remark:''};
 const f=(l,i,v,t='text')=>`<label class="k">${l}</label><input id="${i}" type="${t}" value="${esc(v)}">`;
 return `<div class="modal"><div class="sheet"><h2>${id?'Edit':'Add'} student</h2>${f('Name','n',s.name)}<label class="k">Class</label><select id="c">${selOpts(classes().map(c=>[c,c]),s.cls)}</select>${f('School','sc',s.school||'')}${f('Phone','ph',s.phone||'')}${f('Subjects (name:score, …)','su',Object.entries(s.subjects).map(e=>e.join(':')).join(', '))}${f('Tests, most recent first (name:score, …)','te',s.tests.map(t=>t.n+':'+t.s).join(', '))}${f('Total fees ₹','ft',s.fee.total,'number')}${f('Fees paid ₹','fp',s.fee.paid,'number')}${f('Fee due date','fd',s.fee.due,'date')}<label class="k">Teacher’s remark</label><textarea id="rm" rows="2">${esc(s.remark)}</textarea><button data-act="ssave" data-id="${id||''}">Save</button> <button class="g" data-act="close">Cancel</button>${id?` <button class="d" data-act="sdel" data-id="${id}">Delete</button>`:''}</div></div>`;
}
function render(){
 if(!user)return $('app').innerHTML=login();
 const pg={home,report,fees,notes}[tab]();
 $('app').innerHTML=`<main><div class="top"><div><h1>🎓 ${esc(S.centre)}</h1><small>${esc(user.name)} · ${isT()?esc(user.subject)+' teacher':esc(user.cls)}</small></div><span>${T()?`<button class="g" data-act="name">✏️</button>`:''}</span></div>${pg}</main>${modal}<nav>${[['home','🏠','Home'],['report','📊','Report Card'],['fees','💰','Fees'],['notes','📚','Notes']].map(t=>`<a href="#${t[0]}" class="${tab===t[0]?'on':''}"><i>${t[1]}</i>${t[2]}</a>`).join('')}</nav>${msg?`<div class="toast">${esc(msg)}</div>`:''}`;
}
async function save(){
 if(!art)return toast('Open the app as the owner to save changes');
 const c=document.documentElement.cloneNode(true);
 c.querySelector('#app').innerHTML='';
 c.querySelector('#app-data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
 try{await art.publish('<!doctype html>\n'+c.outerHTML)}catch(e){toast('Could not save, try again')}
}
const kv=t=>t.split(',').map(x=>x.split(':')).filter(a=>a[0].trim()&&a[1]&&a[1].trim()&&!isNaN(a[1])).map(a=>[a[0].trim(),+a[1]]);
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-edit],[data-act],[data-del]');if(!t)return;const d=t.dataset;
 if(d.edit){modal=sheet(d.edit);return render()}
 if(d.del){S.notes=S.notes.filter(n=>n.id!==d.del);return save()}
 const g=k=>$(k).value;
 if(d.act==='add'){modal=sheet('');render()}
 else if(d.act==='lr'){lrole=d.r;render()}
 else if(d.act==='login'){
  const err=m=>{$('le').textContent=m},ph=g('lp').replace(/\D/g,''),nm=g('ln').trim(),x=g('ls').trim();
  if(nm.length<2)return err('Please enter your full name');
  if(!x)return err(lrole==='student'?'Please enter your school':'Please enter your subject');
  if(ph.length<10)return err('Please enter a valid phone number');
  let k='',fresh=0;
  if(lrole==='teacher'){
   const pw=g('pw');
   try{
    if(!S.pin){
     if(!teacher)return err('Teacher login is not set up yet. Please ask the owner.');
     if(pw.length<4)return err('Create a PIN of at least 4 characters');
     const s=uid()+uid();S.pin={s,h:await sha(s+pw)};fresh=1;
    }else if(await sha(S.pin.s+pw)!==S.pin.h)return err('Wrong teacher PIN');
   }catch(x){return err('Could not check the PIN here')}
   k=S.pin.h;
  }
  user=lrole==='student'?{role:'student',name:nm,cls:g('lc'),school:x,phone:ph}:{role:'teacher',name:nm,subject:x,phone:ph,k};
  LS.set(user);mine=user.cls||'';cls=user.cls||'Class 10';sid=(pool()[0]||{}).id;tab='home';render();if(fresh)save();
 }
 else if(d.act==='close'){modal='';render()}
 else if(d.act==='name'){modal=`<div class="modal"><div class="sheet"><h2>Settings</h2><label class="k">Centre name</label><input id="cn" value="${esc(S.centre)}"><label class="k">New teacher PIN (leave empty to keep)</label><input id="pn" type="password"><button data-act="nsave">Save</button> <button class="g" data-act="close">Cancel</button></div></div>`;render()}
 else if(d.act==='nsave'){S.centre=g('cn').trim()||S.centre;const pw=g('pn');if(pw){if(pw.length<4)return toast('PIN needs at least 4 characters');try{const s=uid()+uid();S.pin={s,h:await sha(s+pw)};user.k=S.pin.h;LS.set(user)}catch(x){return toast('Could not set the PIN here')}}save()}
 else if(d.act==='ssave'){
  const id=d.id||uid(),o={id,name:g('n').trim()||'Student',cls:g('c')||'Class 1',school:g('sc').trim(),phone:g('ph').trim(),subjects:Object.fromEntries(kv(g('su'))),tests:kv(g('te')).map(a=>({n:a[0],s:a[1]})),fee:{total:+g('ft')||0,paid:+g('fp')||0,due:g('fd')},remark:g('rm').trim()};
  const i=S.students.findIndex(x=>x.id===id);i<0?S.students.push(o):S.students[i]=o;sid=id;cls=o.cls;save();
 }
 else if(d.act==='sdel'){S.students=S.students.filter(x=>x.id!==d.id);sid=(S.students[0]||{}).id;save()}
 else if(d.act==='up'){
  const f=$('nf').files[0];if(!f)return toast('Choose a file first');if(!assets)return toast('Uploads are not available here');
  try{const r=await assets.upload(f);S.notes.unshift({id:uid(),title:g('nt').trim()||f.name,cls:g('nc'),aid:r.id,date:td()});save()}catch(x){toast('Upload failed')}
 }
});
document.addEventListener('change',e=>{
 if(e.target.id==='cs'){cls=e.target.value;render()}
 if(e.target.id==='ss'){sid=e.target.value;render()}
});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.includes(h)){tab=h;render()}});
render();
(async()=>{try{const c=window.claude;if(!c)return;const u=await c.use('user');teacher=!!(u&&(u.isOwner()||u.canEdit()));art=await c.use('artifact');assets=await c.use('assets');render()}catch(e){}})();
</script>

</body></html>
